<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>07 · Dashboard</title>
<link rel="stylesheet" href="post.css">
<style>
  .tray { background: #E6E0E1; border-radius: 52px; padding: 28px; }
  .w { border-radius: 34px; padding: 32px 36px; color: #fff; position: relative; overflow: hidden; }
  .w.red { background: linear-gradient(150deg, #3a0710, #1a0306 60%, #2a050b); box-shadow: inset 0 0 0 2px rgba(245,2,43,.45), inset 0 1px 0 rgba(255,255,255,.12), 0 0 40px rgba(245,2,43,.22); }
  .w.black { background: linear-gradient(150deg, #2a2627, #121011); box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
  .lbl { font-size: 18px; letter-spacing: .12em; color: #FF5A74; font-weight: 700; }
  .bars { position: absolute; right: 40px; bottom: 40px; height: 150px; display: flex; align-items: flex-end; gap: 10px; }
  .bars i { width: 16px; border-radius: 5px; background: linear-gradient(180deg, #FF4A68, #C40020); }
</style></head>
<body><div class="post light grain">
  <div style="left:0;right:0;top:200px;text-align:center">
    <div style="font-weight:500;font-size:58px;letter-spacing:-.03em;color:var(--red)">Feito pensando em</div>
    <div style="font-weight:900;font-size:168px;letter-spacing:-.055em;line-height:.95;color:var(--red)">Praticidade</div>
  </div>

  <div class="tray" style="left:150px;top:560px">
    <div class="w red" style="width:724px;height:250px">
      <div class="lbl">VENDAS HOJE</div>
      <div style="font-weight:800;font-size:56px;letter-spacing:-.03em;margin-top:16px">R$ 12.480,90</div>
      <div style="font-size:24px;font-weight:600;margin-top:4px">64 Pix pagos <span style="color:var(--ok);margin-left:8px">+22%</span></div>
      <div class="bars"><i style="height:18%"></i><i style="height:32%"></i><i style="height:24%"></i><i style="height:50%"></i><i style="height:42%"></i><i style="height:68%"></i><i style="height:60%"></i><i style="height:86%"></i><i style="height:74%"></i><i style="height:100%"></i></div>
    </div>
  </div>

  <div class="tray" style="left:210px;top:880px">
    <div class="w black" style="width:604px;height:200px;display:flex;align-items:center;gap:28px">
      <img src="assets/logo-icon.png" style="width:96px;filter:drop-shadow(0 0 16px rgba(245,2,43,.7))">
      <div><div style="font-size:26px;font-weight:600;opacity:.7">VulcanoPay · hoje</div><div style="font-weight:900;font-size:62px;letter-spacing:-.035em">R$ 12.480,90</div></div>
    </div>
  </div>

  <div style="left:0;right:0;bottom:0;height:170px;background:var(--red)"></div>
  <div class="footer" style="bottom:50px;color:#fff">
    <img class="logo-sm" src="assets/logo-full-dark.png" style="filter:brightness(0) invert(1)">
    <div class="line" style="opacity:.6"></div>
    <div class="tag">Migre para<b>VulcanoPay</b></div>
  </div>
</div></body></html>
