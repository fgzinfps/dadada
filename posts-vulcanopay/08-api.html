<link rel="stylesheet" href="post.css">

  .code { left: 72px; right: 72px; top: 560px; padding: 0 0 34px; overflow: hidden; }

  .chips { left: 72px; top: 1050px; display: flex; flex-direction: column; gap: 14px; }
