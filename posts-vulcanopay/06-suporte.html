<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>06 · Suporte</title>
<link rel="stylesheet" href="post.css">
<style>
  .watermark { left: -40px; top: 0; height: 1350px; writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 900; font-size: 300px; letter-spacing: -.04em; line-height: 1; color: rgba(245,2,43,.07); }
  .bubble { left: 120px; top: 150px; width: 560px; padding: 60px 54px 80px; background: var(--red); color: #fff; border-radius: 64px; box-shadow: 0 40px 90px rgba(245,2,43,.3); }
  .bubble::after { content: ""; position: absolute; right: 120px; bottom: -40px; width: 80px; height: 80px; background: var(--red); clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .bubble .q { font-weight: 500; font-size: 66px; line-height: 1.02; letter-spacing: -.04em; }
  .bubble .q b { font-weight: 900; }
  .bubble .s { font-size: 30px; line-height: 1.3; margin-top: 28px; font-weight: 500; opacity: .95; }
  .cta2 { left: 260px; top: 575px; background: #6E0013; color: #fff; border-radius: 999px; padding: 18px 20px 18px 38px; display: flex; align-items: center; gap: 22px; font-size: 32px; font-weight: 600; box-shadow: 0 20px 44px rgba(90,0,16,.35); }
  .cta2 i { width: 56px; height: 56px; border-radius: 50%; background: var(--red); display: grid; place-items: center; }
  .cta2 svg { width: 28px; height: 28px; }
  .msg { padding: 22px 28px 16px; font-size: 26px; line-height: 1.3; border-radius: 30px; box-shadow: 0 20px 50px rgba(40,0,8,.12); }
  .msg time { display: block; text-align: right; font-size: 16px; opacity: .5; margin-top: 6px; }
  .me { background: #fff; color: var(--ink); border-bottom-right-radius: 10px; }
  .them { background: #141012; color: #fff; border-bottom-left-radius: 10px; display: flex; gap: 18px; align-items: flex-start; }
  .them .av { width: 52px; height: 52px; border-radius: 50%; background: #2a0a10; display: grid; place-items: center; flex: none; }
  .them .av img { width: 34px; }
</style></head>
<body><div class="post light grain">
  <div class="watermark">VULCANO</div>

  <div class="bubble">
    <div class="q">Suporte que te deixa no <b>vácuo?</b></div>
    <div class="s">Na VulcanoPay você fala com gente de verdade.</div>
  </div>
  <div class="cta2">Migre para VulcanoPay <i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></i></div>

  <div class="msg me" style="right:96px;top:780px;width:460px">Meu Pix tá pendente, pode ver?<time>14:31</time></div>
  <div class="msg them" style="right:150px;top:930px;width:560px">
    <div class="av"><img src="assets/logo-icon.png"></div>
    <div>Confirmado e já no seu saldo ✅<time>14:32</time></div>
  </div>

  <div class="footer">
    <img class="logo-sm" src="assets/logo-full-light.png">
    <div class="line"></div>
    <div class="tag" style="color:var(--red)"><b>VulcanoPay</b></div>
  </div>
</div></body></html>
